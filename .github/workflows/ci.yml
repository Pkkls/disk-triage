name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: dirmap selftest
        run: python dirmap.py --selftest
      - name: dupescan selftest
        run: python dupescan.py --selftest
      - name: secretscan selftest
        run: python secretscan.py --selftest
      - name: notecheck selftest
        run: python notecheck.py --selftest
      # The scanner must stay clean against its own checkout. Deliberately
      # --head-only: this repository's own test fixtures contain strings shaped
      # like credentials, so a full-history scan will always match them once
      # they are committed. What matters on every push is that no secret is
      # being added now.
      - name: secretscan finds nothing in the checkout
        run: python secretscan.py . --head-only
      # These scripts walk other people's directories, so a crash on an
      # unreadable path or an odd filename is the failure mode that matters.
      - name: Runs against a real tree without crashing
        run: |
          python dirmap.py . --out map.html
          python dupescan.py . --min-mb 0.001
